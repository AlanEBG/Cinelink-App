name: cinelink_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Media
  youtube_player_flutter: ^9.1.3

  # HTTP & API
  dio: ^5.9.0
  http: ^1.6.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Cookie Management
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # State Management
  provider: ^6.1.5+1

  # JSON Serialization
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.19.0
  # UI
  animated_bottom_navigation_bar: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.10.4
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  # Incluir .env
  assets:
    - .env
