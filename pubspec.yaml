name: cinelink_app
description: "A Flutter cinema application with authentication."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.9.0
  http: ^1.1.0
  
  # Cookie Management
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  
  # Secure Storage para tokens
  flutter_secure_storage: ^9.2.4
  
  # State Management
  provider: ^6.1.5+1
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # UI
  cupertino_icons: ^1.0.8
  bubble_bottom_bar: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  # Assets - descomenta y agrega tus imágenes aquí si las necesitas
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Fonts - descomenta si quieres agregar fuentes personalizadas
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700